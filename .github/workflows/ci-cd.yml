name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linters
      run: |
        pip install flake8 black pylint
    
    - name: Run flake8
      continue-on-error: true
      run: |
        cd backend
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run black
      continue-on-error: true
      run: |
        cd backend
        black --check --diff .
    
    - name: Run pylint
      continue-on-error: true
      run: |
        cd backend
        pylint **/*.py --exit-zero

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Create .env for tests
      run: |
        echo "MINIO_ROOT_USER=minioadmin" > .env
        echo "MINIO_ROOT_PASSWORD=minioadmin123" >> .env
        echo "SECRET_KEY=test-secret-key-please-change" >> .env
    
    - name: Clean old volumes
      run: |
        docker compose down -v || true
        docker system prune -f || true
    
    - name: Build Docker images
      run: docker compose build
    
    - name: Start services
      run: |
        docker compose down -v
        docker compose build
        docker compose up -d
    
    - name: Wait for services
      run: sleep 30
    
    - name: Show logs if failed
      if: failure()
      run: docker compose logs --tail=50
    
    - name: Check backend is running
      run: |
        curl -f http://localhost:8000/docs || exit 1
    
    - name: Stop services
      run: docker compose down

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Build images
      run: docker compose build
    
    - name: Check image sizes
      run: |
        echo "=== Image sizes ==="
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
    
    - name: Check .env.example exists
      run: |
        if [ -f ".env.example" ]; then
          echo "OK: .env.example exists"
        else
          echo "WARNING: .env.example not found"
        fi
    
    - name: Check .dockerignore exists
      run: |
        if [ -f ".dockerignore" ]; then
          echo "OK: .dockerignore exists"
        else
          echo "WARNING: .dockerignore not found"
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to server via SSH
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        if [ -z "$SSH_HOST" ]; then
          echo "No SSH_HOST configured. Skipping deployment."
          exit 0
        fi
        
        echo "$SSH_KEY" > deploy_key
        chmod 600 deploy_key
        
        ssh -o StrictHostKeyChecking=no -i deploy_key ${SSH_USER}@${SSH_HOST} << 'EOF'
          cd /app || mkdir -p /app && cd /app
          git pull origin main
          docker compose down
          docker compose build
          docker compose up -d
          docker system prune -f
        EOF
        
        rm -f deploy_key

  report:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: always()
    
    steps:
    - name: Generate report
      run: |
        echo "CI/CD Pipeline Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Pipeline completed for commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY