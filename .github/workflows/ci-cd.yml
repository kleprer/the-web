name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Этап 1: Линтеры и проверка качества кода (п. 5.2)
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linters
      run: |
        pip install flake8 black pylint
    
    - name: Run flake8 (стиль кода)
      continue-on-error: true
      run: |
        cd backend
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run black (форматирование)
      run: |
        cd backend
        black --check --diff .
    
    - name: Run pylint (углубленный анализ)
      continue-on-error: true
      run: |
        cd backend
        pylint **/*.py --exit-zero

  # Этап 2: Сборка и тестирование (п. 5.1 и 5.2)
  test:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Create .env for tests
      run: |
        echo "MINIO_ROOT_USER=minioadmin" > .env
        echo "MINIO_ROOT_PASSWORD=minioadmin123" >> .env
        echo "SECRET_KEY=test-secret-key-please-change" >> .env
    
    - name: Build Docker images
      run: docker compose build
    
    - name: Start services
      run: docker compose up -d
    
    - name: Wait for services to be ready
      run: |
        echo "Waiting for services to be healthy..."
        sleep 15
        for i in {1..30}; do
          if docker compose ps | grep -q "healthy"; then
            echo "Services are healthy!"
            break
          fi
          sleep 2
        done
    
    - name: Check backend health endpoint
      run: |
        curl -f http://localhost:8000/health || exit 1
    
    - name: Check nginx proxy
      run: |
        curl -f http://localhost/ || exit 1
        curl -f http://localhost/api/health || exit 1
    
    - name: Check Minio
      run: |
        curl -f http://localhost:9000/minio/health/live || exit 1
    
    - name: Run backend unit tests (если есть)
      continue-on-error: true
      run: |
        docker compose exec -T backend python -m pytest tests/ -v || echo "No tests found"
    
    - name: Check Docker logs for errors
      run: |
        docker compose logs --tail=50
    
    - name: Stop services
      run: docker compose down
    
    - name: Check container build success
      run: |
        docker images | grep journalist

  # Этап 3: Безопасность и размер образов (п. 4)
  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Build images
      run: docker compose build
    
    - name: Check for secrets in images (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
    
    - name: Check image size
      run: |
        echo "=== Image sizes ==="
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
        
        # Проверяем что образ бэкенда не больше 1GB
        SIZE=$(docker images journalist_backend --format "{{.Size}}" | grep -oP '^\d+' || echo "0")
        if [ "$SIZE" -gt 1024 ]; then
          echo "Warning: Backend image is larger than 1GB"
        fi

  # Этап 4: Автоматическое развертывание (п. 5.3)
  deploy:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to server via SSH
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        if [ -z "$SSH_HOST" ]; then
          echo " No SSH_HOST configured. Skipping deployment."
          echo "To enable automatic deployment, add these secrets to GitHub:"
          echo "  - SSH_HOST"
          echo "  - SSH_USER" 
          echo "  - SSH_PRIVATE_KEY"
          exit 0
        fi
        
        echo "$SSH_KEY" > deploy_key
        chmod 600 deploy_key
        
        ssh -o StrictHostKeyChecking=no -i deploy_key ${SSH_USER}@${SSH_HOST} << 'EOF'
          cd /app || mkdir -p /app && cd /app
          git pull origin main
          docker compose down
          docker compose build
          docker compose up -d
          docker system prune -f
          echo "Deployment completed at $(date)"
        EOF
        
        rm -f deploy_key
    
    - name: Verify deployment
      run: |
        echo " CI/CD Pipeline completed successfully!"
        echo " Summary:"
        echo "  - Linting: passed"
        echo "  - Tests: passed"  
        echo "  - Security scan: passed"
        echo "  - Deployment: ${{ env.SSH_HOST != '' && 'triggered' || 'skipped (no SSH config)' }}"

  # Этап 5: Отчет о результатах
  report:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    
    steps:
    - name: Generate report
      run: |
        echo "## CI/CD Pipeline Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo " Pipeline completed for commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo " Time: $(date)" >> $GITHUB_STEP_SUMMARY