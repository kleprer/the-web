services:
  minio:
    image: minio/minio:latest
    container_name: journalist_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    container_name: journalist_backend
    environment:
      DATABASE_URL: sqlite:///./test.db
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: journalist-assistant
      S3_USE_SSL: "false"
      SECRET_KEY: my-secret-key-change-me
    ports:
      - "8000:8000"
    depends_on:
      - minio
    volumes:
      - ./backend:/app
      - backend_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: journalist_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  minio_data:
  backend_data: