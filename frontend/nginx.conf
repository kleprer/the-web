server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API прокси - ИСПРАВЛЕНО ИМЯ КОНТЕЙНЕРА
    location /api/ {
        proxy_pass http://journalist_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}